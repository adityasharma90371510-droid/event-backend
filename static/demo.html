<!DOCTYPE html>
<html>
<head>
<title>Event Registration</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial;

    background: linear-gradient(to top,
        #5aa9d6,
        #87CEEB,
        #ffd194,
        #ff9a9e);
}

.scene {
    position: absolute;
    bottom: -300px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    transition: all 1.2s ease;
}

.rise {
    bottom: 120px;
}

.fly {
    transform: translate(-50%, -1200px);
    transition: transform 3s ease-in-out;
}

.balloon {
    width: 180px;
}

.basket {
    width: 230px;
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-top: -10px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.3);
}

input {
    width: 100%;
    margin: 6px 0;
    padding: 6px;
}

button {
    margin-top: 8px;
    padding: 8px;
    width: 100%;
    cursor: pointer;
}

#finalScreen {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    display: none;
}

#finalText {
    font-size: 40px;
    font-weight: bold;
}

#restartBtn {
    margin-top: 10px;
    font-size: 14px;
    cursor: pointer;
}

</style>
</head>

<body>

<div id="scene" class="scene">

    <!-- FIX THIS IMAGE MANUALLY -->
    <img class="balloon"
    src="https://cdn-icons-png.flaticon.com/512/744/744465.png">

    <div class="basket">

        <input id="name" placeholder="Name">
        <input id="occupation" placeholder="Occupation">
        <input id="city" placeholder="City">

        <button onclick="register()">Register</button>

    </div>
</div>

<div id="finalScreen">
    <div id="finalText">THANK YOU FOR REGISTERING 🎉</div>
    <div id="restartBtn" onclick="startNew()">start new registration</div>
</div>

<script>

window.onload = () => {
    setTimeout(() => {
        scene.classList.add("rise");
    }, 200);
};

function register() {

    fetch("http://127.0.0.1:5001/clients", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: name.value,
            occupation: occupation.value,
            city: city.value
        })
    })
    .then(res => res.json())
    .then(() => {
        launch();
    });
}

function launch() {

    scene.classList.remove("rise");
    scene.classList.add("fly");

    setTimeout(() => {
        scene.style.display = "none";
        finalScreen.style.display = "block";
    }, 3000);
}

function startNew() {

    finalScreen.style.display = "none";

    scene.style.display = "block";
    scene.classList.remove("fly");

    scene.style.bottom = "-300px";

    // reset inputs
    document.querySelectorAll("input").forEach(i => i.value = "");

    // IMPORTANT: force reflow trick (fixes your bug)
    void scene.offsetHeight;

    scene.classList.remove("rise");

    setTimeout(() => {
        scene.classList.add("rise");
    }, 100);
}

</script>

</body>
</html>
